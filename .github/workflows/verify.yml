name: Verify infrastructure container
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the actual Linux container
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag hackathon-infrastructure:test .
          docker run --detach --rm --name hackathon-infrastructure --publish 127.0.0.1:8080:8080 --env PORT=8080 hackathon-infrastructure:test
          trap 'docker logs hackathon-infrastructure; docker stop hackathon-infrastructure' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health > /tmp/health.json
          python -c 'import json; d=json.load(open("/tmp/health.json")); assert d["status"]=="ok" and d["scope"]=="infrastructure-only"; print("Linux container health: PASS")'
          curl --fail http://127.0.0.1:8080/api/readiness > /tmp/readiness.json
          python -c 'import json; d=json.load(open("/tmp/readiness.json")); assert d["template_only"] and not d["model_access_verified"] and not d["deployment_verified"]; print("Honest readiness flags: PASS")'
          curl --fail http://127.0.0.1:8080/ > /tmp/index.html
          grep -q '해커톤 공통 템플릿' /tmp/index.html
