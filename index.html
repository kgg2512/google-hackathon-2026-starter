<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>해커톤 공통 템플릿</title>
<style>body{background:#101010;color:#ddd;font:17px system-ui;max-width:760px;margin:8vh auto;padding:24px}h1{color:white}button{background:#245edb;color:white;border:0;border-radius:8px;padding:12px 18px;font:inherit}pre{white-space:pre-wrap;background:#202020;padding:20px;border-radius:10px}p{line-height:1.7}</style></head>
<body><h1>해커톤 공통 템플릿</h1>
<p>서버와 배포 기반만 준비된 상태입니다. 출품 기능, 모델 연결, 클라우드 배포는 아직 구현하거나 검증하지 않았습니다. 시연 코드는 행사 시작 후 작성합니다.</p>
<button id="check">로컬 준비 상태 확인</button><pre id="result" role="status">확인 전</pre>
<script>document.getElementById('check').addEventListener('click',async()=>{const out=document.getElementById('result');try{const r=await fetch('/api/readiness');if(!r.ok)throw new Error('HTTP '+r.status);out.textContent=JSON.stringify(await r.json(),null,2)}catch(e){out.textContent='확인 실패: '+e.message}});</script>
</body></html>
